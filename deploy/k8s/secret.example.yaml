# Template for the app's runtime secrets. DO NOT commit real values — create the
# real Secret from a secrets manager (Sealed Secrets / External Secrets / SOPS).
#
#   kubectl create secret generic incommand-secrets --from-env-file=prod.env
#
apiVersion: v1
kind: Secret
metadata:
  name: incommand-secrets
type: Opaque
stringData:
  # App connects as the LEAST-PRIVILEGE role via the managed TRANSACTION pooler.
  DATABASE_URL: "postgres://mitiga_app:CHANGE_ME@your-db-pooler-host:6432/mitiga?sslmode=require"
  # Privileged role — used ONLY by the migrate Job, never by the app pods.
  DATABASE_ADMIN_URL: "postgres://admin:CHANGE_ME@your-db-primary-host:5432/mitiga?sslmode=require"

  AUTH_SECRET: "CHANGE_ME_openssl_rand_base64_32"
  APP_URL: "https://incommand.your-domain.example"

  REDIS_URL: "rediss://:CHANGE_ME@your-redis-host:6379"

  # Object storage (R2/S3)
  S3_ENDPOINT: "https://your-account.r2.cloudflarestorage.com"
  S3_REGION: "auto"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  S3_BUCKET: "incommand"
  S3_FORCE_PATH_STYLE: "true"

  # Email (invites + password resets)
  EMAIL_TRANSPORT: "smtp"
  EMAIL_FROM: "InCommand <no-reply@your-domain.example>"
  SMTP_HOST: "email-smtp.your-region.amazonaws.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
